name: Deploy TheRoute (Climb)

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: linux
    steps:
      - name: Sync to runtime directory (NFS)
        run: |
          cd /home/brownjeon/NFS/homes/brownjeon/project/TheRoute
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}
          # mobile/web 의 node_modules·빌드 산출물 + backend node_modules + .env 보존
          git clean -fdx \
            -e backend/.env \
            -e backend/node_modules \
            -e mobile/node_modules \
            -e mobile/.expo \
            -e web/node_modules \
            -e web/dist \
            -e logs \
            -e uploads

      - name: Install backend dependencies
        working-directory: /home/brownjeon/NFS/homes/brownjeon/project/TheRoute/backend
        run: npm ci --no-audit --no-fund --omit=dev

      - name: Reload PM2
        run: pm2 reload theroute --update-env

      - name: Health check
        run: |
          sleep 3
          curl -fsS http://127.0.0.1:3100/ -o /dev/null \
            || (pm2 logs theroute --lines 30 --nostream && exit 1)
