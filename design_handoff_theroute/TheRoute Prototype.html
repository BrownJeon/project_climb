<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TheRoute — Climbing Log</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"/>
<style>
  body{overflow:hidden}
  /* hide scrollbars in artboards */
  .ab-scroll::-webkit-scrollbar{display:none}
  .ab-scroll{scrollbar-width:none; -ms-overflow-style:none}
</style>
<script>
  // Apply theme/primary BEFORE React mounts to avoid flash
  (function(){
    const t = localStorage.getItem('theroute-theme');
    if (t==='dark') document.documentElement.dataset.theme='dark';
    const p = localStorage.getItem('theroute-primary');
    if (p) document.documentElement.style.setProperty('--primary', p);
  })();
</script>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="app/data.js"></script>
<script type="text/babel" src="app/ui.jsx"></script>
<script type="text/babel" src="app/screens.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel" data-presets="react">
// useState/useEffect are already destructured from React in app/ui.jsx

// Wrap a screen in iOS device chrome
function Phone({ label, dark, children }){
  return (
    <IOSDevice width={390} height={844} dark={!!dark}>
      <div data-screen-label={label} style={{
        width:'100%', height:'100%', position:'relative',
        background:'var(--bg)', color:'var(--ink-1)',
        overflow:'hidden', display:'flex', flexDirection:'column',
        // iOS status bar reserves ~54px at top
        paddingTop: 54,
      }}>
        <div className="ab-scroll" style={{flex:1, overflowY:'auto', WebkitOverflowScrolling:'touch'}}>
          {children}
        </div>
      </div>
    </IOSDevice>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "primary": "oklch(60% 0.20 25)",
  "darkMode": true
}/*EDITMODE-END*/;

const PRIMARY_OPTIONS = [
  { v:'oklch(67% 0.18 38)',  l:'Hold Orange' },
  { v:'oklch(60% 0.20 25)',  l:'Climb Red' },
  { v:'oklch(58% 0.16 280)', l:'Indigo' },
  { v:'oklch(62% 0.16 155)', l:'Forest' },
  { v:'oklch(50% 0.04 60)',  l:'Slate' },
];

function App(){
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  useEffect(()=>{
    document.documentElement.style.setProperty('--primary', tweaks.primary);
    localStorage.setItem('theroute-primary', tweaks.primary);
  },[tweaks.primary]);

  useEffect(()=>{
    if (tweaks.darkMode) document.documentElement.dataset.theme='dark';
    else delete document.documentElement.dataset.theme;
    localStorage.setItem('theroute-theme', tweaks.darkMode?'dark':'light');
  },[tweaks.darkMode]);

  return (
    <>
      <DesignCanvas
        title={<span><span style={{color:'var(--primary)'}}>The</span>Route <span style={{fontWeight:500, color:'var(--ink-3)', fontSize:'0.7em'}}>· Climbing Log</span></span>}
        subtitle="iOS 프로토타입 · 8개 화면 · 한국어"
      >
        <DCSection id="core" title="Core Loop" subtitle="홈 → 영상 → 기록">
          <DCArtboard id="01" label="01 · 홈/피드" width={440} height={920}>
            <Phone label="01 Home"><HomeScreen/></Phone>
          </DCArtboard>
          <DCArtboard id="02" label="02 · 영상 상세" width={440} height={920}>
            <Phone label="02 Route Detail"><RouteDetail/></Phone>
          </DCArtboard>
          <DCArtboard id="09" label="09 · 세션 추가" width={440} height={920}>
            <Phone label="09 Session Add"><SessionAddModal/></Phone>
          </DCArtboard>
        </DCSection>

        <DCSection id="gyms" title="Gyms" subtitle="암장 탐색 + 상세">
          <DCArtboard id="04" label="04 · 암장 목록" width={440} height={920}>
            <Phone label="04 Gym List"><GymList/></Phone>
          </DCArtboard>
          <DCArtboard id="05" label="05 · 암장 상세" width={440} height={920}>
            <Phone label="05 Gym Detail"><GymDetail/></Phone>
          </DCArtboard>
        </DCSection>

        <DCSection id="me" title="Records & Me" subtitle="캘린더 · 마이 · 훈련">
          <DCArtboard id="06" label="06 · 캘린더" width={440} height={920}>
            <Phone label="06 Calendar"><CalendarScreen/></Phone>
          </DCArtboard>
          <DCArtboard id="07" label="07 · 마이페이지" width={440} height={920}>
            <Phone label="07 My Page"><MyPage/></Phone>
          </DCArtboard>
          <DCArtboard id="08" label="08 · 훈련" width={440} height={920}>
            <Phone label="08 Training"><TrainingScreen/></Phone>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme">
          <TweakToggle label="다크 모드"
            value={tweaks.darkMode} onChange={v=>setTweak('darkMode', v)}/>
          <TweakSelect label="Primary"
            value={tweaks.primary}
            onChange={v=>setTweak('primary', v)}
            options={PRIMARY_OPTIONS.map(o=>({value:o.v, label:o.l}))}/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
