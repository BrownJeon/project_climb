<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>더 루트</title>
    <!--
      연결 실패 안내 — 사용자 승인 데모 v1(docs/demo/T009-android-apk-v1.html §2 "제안 v1",
      docs/web-design/T009-android-apk-guide.md §2-3). 이 파일은 웹 번들 밖의 단독 HTML 이라 CSS 변수를 못 읽는다 —
      색은 web/src/styles/tokens.css 의 값을 그대로 복사하고 옆에 토큰 이름을 적는다.
      오프라인 화면이므로 외부 글꼴(Pretendard)을 불러오지 않고 시스템 글꼴을 쓴다.
    -->
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        background: #f6f5f3; /* --bg */
        color: #6b6b68; /* --ink-3 */
        font-family: -apple-system, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        font-size: 14px; line-height: 1.6;
      }
      main { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
      .appname { font-size: 13px; font-weight: 600; color: #6b6b68; /* --ink-3 */ margin: 0 0 14px; letter-spacing: -0.1px; }
      h1 { font-size: 18px; font-weight: 700; color: #131313; /* --ink-1 */ margin: 0 0 6px; word-break: keep-all; }
      .sub { font-size: 14px; margin: 0; word-break: keep-all; }
      .cta {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 52px; min-width: 200px; padding: 0 28px; margin-top: 22px;
        border: 0; border-radius: 10px; /* --r-sm */
        background: #ee6438; /* --primary 의 sRGB 근사 — oklch 를 모르는 구형 WebView 용 */
        background: oklch(67% 0.18 38); /* --primary */
        color: #fff; font: inherit; font-size: 19px; font-weight: 700; letter-spacing: -0.2px; cursor: pointer;
      }
      .cta:active { filter: brightness(.94); }
      .cta:focus-visible { outline: 3px solid #9d2800; /* --primary-ink */ outline-offset: 2px; }
      .connecting { display: inline-flex; gap: 10px; align-items: center; margin-top: 22px; min-height: 52px; font-size: 15px; color: #3a3a39; /* --ink-2 */ }
      .spinner {
        width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%;
        border: 2.5px solid #e0dfdb; /* --line-2 */
        border-top-color: #ee6438; border-top-color: oklch(67% 0.18 38); /* --primary */
        animation: spin .9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <p class="appname">더 루트</p>
        <div id="fail">
          <h1>서버에 연결할 수 없습니다</h1>
          <p class="sub">인터넷 연결을 확인한 뒤 다시 시도해 주세요.</p>
          <button type="button" class="cta" id="retry">다시 시도</button>
        </div>
        <div id="retrying" hidden>
          <h1>다시 연결하는 중…</h1>
          <p class="sub">잠시만 기다려 주세요.</p>
          <span class="connecting"><span class="spinner" aria-hidden="true"></span>연결 중</span>
        </div>
        <p class="sr-only" aria-live="polite" id="live"></p>
      </div>
    </main>
    <script>
      /*
        이 파일은 거의 보이지 않는다. 앱은 capacitor.config.ts 의 server.url 로 운영 웹을 직접 로드하고,
        이 파일은 server.errorPath 로 지정돼 운영 웹을 불러오지 못했을 때만 뜬다.
        Android 에서 이 오류 페이지는 Capacitor 플러그인에 접근할 수 없다 — 순수 HTML 로만 동작한다(요청·플러그인 없음).
        "다시 시도" 를 누르거나 기기가 다시 온라인이 되면 실패 묶음을 숨기고 "다시 연결하는 중…" 을 보인 뒤 운영 주소로
        이동만 한다. 이동이 또 실패하면 Capacitor 가 이 화면을 다시 띄우므로 자연히 실패 상태로 돌아온다(시간 제한 없음).
      */
      (function () {
        var APP_URL = 'https://climb.xn--lh0b87pnudm10a4vd.com/';
        function retry() {
          document.getElementById('fail').hidden = true;
          document.getElementById('retrying').hidden = false;
          document.getElementById('live').textContent = '다시 연결하는 중입니다';
          location.replace(APP_URL);
        }
        document.getElementById('retry').addEventListener('click', retry);
        window.addEventListener('online', retry);
      })();
    </script>
  </body>
</html>
